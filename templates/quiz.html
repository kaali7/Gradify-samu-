<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic | capitalize }} Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f4f4f9;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding-top: 50px;
        }

        .quiz-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            border-radius: 8px;
            background-color: #fff;
        }

        .btn-custom {
            background-color: #007bff;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }

        .progress-bar-custom {
            background-color: #007bff;
        }

        .result-container {
            display: none;
        }
    </style>
</head>

<body>
    <div class="quiz-container">
        <div class="quiz-card">
            <h1 class="text-center mb-4 text-primary">{{ topic | capitalize }} Quiz</h1>

            {% for question in questions %}
            <div class="modal fade" id="questionModal{{ loop.index }}" tabindex="-1" aria-hidden="true"
                data-correct-answer="{{ question.correct }}">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">{{ question.question }}</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="progress mb-4">
                            <div class="progress-bar progress-bar-custom" role="progressbar" style="width: 0%;" 
                                aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <div class="modal-body">
                            {% for option in question.options %}
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="q{{ loop.index0 }}"
                                    id="q{{ loop.index0 }}-{{ loop.index }}" value="{{ option }}">
                                <label class="form-check-label" for="q{{ loop.index0 }}-{{ loop.index }}">
                                    {{ option }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Skip</button>
                            <button type="button" class="btn btn-primary"
                                data-bs-target="#questionModal{{ loop.index + 1 }}" data-bs-toggle="modal"
                                onclick="updateProgressBar({{ loop.index }}, {{ questions|length }})">Next</button>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}

            <div class="text-center mt-4">
                <button type="button" class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#questionModal1"
                    onclick="updateProgressBar(1, {{ questions|length }})">Start Quiz</button>
                <a href="/cousres" class="btn btn-dark">Back</a>
            </div>
        </div>

        <div id="result" class="result-container mt-4 alert alert-info">
            <h4 class="text-center">Your score: <span id="score"></span> out of {{ questions|length }}</h4>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let score = 0;
        let currentQuestionIndex = 0; // Track the current question index.
    
        // Update the progress bar based on the current question.
        function updateProgressBar(currentQuestion, totalQuestions) {
            const progress = (currentQuestion / totalQuestions) * 100;
            const progressBar = document.querySelector(".progress-bar-custom");
            if (progressBar) {
                progressBar.style.width = progress + "%";
                progressBar.setAttribute("aria-valuenow", currentQuestion);
            }
        }
    
        // Clear the progress bar when skipping a question.
        function resetProgressBar() {
            const progressBar = document.querySelector(".progress-bar-custom");
            if (progressBar) {
                progressBar.style.width = "0%";
                progressBar.setAttribute("aria-valuenow", "0");
            }
        }
    
        // Update the score if the selected answer is correct.
        function updateScore(questionIndex) {
            const selectedAnswer = document.querySelector(`input[name="q${questionIndex}"]:checked`);
            if (selectedAnswer) {
                const correctAnswer = document.getElementById(`questionModal${questionIndex}`).dataset.correctAnswer;
                if (selectedAnswer.value === correctAnswer) {
                    score++;
                }
            }
        }
    
        // Show the result after completing the quiz.
        function showResult() {
            const scoreElement = document.getElementById("score");
            scoreElement.textContent = score;
            document.getElementById("result").style.display = "block";
        }
    
        // Attach event listeners to modal close actions for each question.
        {% for question in questions %}
        document.getElementById(`questionModal{{ loop.index }}`).addEventListener('hidden.bs.modal', () => {
            updateScore({{ loop.index }});
            if ({{ loop.index }} === {{ questions | length }}) {
                showResult();
            }
        });
        {% endfor %}
    
        // Function to handle "Next" button click event.
        function nextQuestion(questionIndex, totalQuestions) {
            updateProgressBar(questionIndex, totalQuestions);
        }
    
        // Function to handle "Skip" button click event.
        function skipQuestion() {
            resetProgressBar();
        }
    </script>
    
</body>

</html>
