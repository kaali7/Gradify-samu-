<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <!-- Link to Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Make logo circular */
        .logo {
          width: 40px;
          /* Adjust size */
          height: 40px;
          /* Adjust size */
          border-radius: 50%;
          /* Make logo circular */
          object-fit: cover;
          /* Ensure the image maintains aspect ratio */
        }
    
        /* Set background image to fill the whole screen */
        .background {
          background-image: url('https://t3.ftcdn.net/jpg/03/91/46/46/10/360_F_391461057_5P0BOWl4lY442Zoo9rzEeJU0S2c1WDZR.jpg');
          background-size: cover;
          /* Ensures the image covers the entire screen */
          background-position: center;
          /* Centers the image */
          height: 100vh;
          /* Make the div take the full height of the viewport */
          display: flex;
          /* Use Flexbox for centering */
          justify-content: center;
          /* Center content horizontally */
          align-items: center;
          /* Center content vertically */
        }
    
        /* Text styling */
        .background h1 {
          color: white;
          /* Change text color to white for contrast */
          font-size: 48px;
          /* Adjust the size of the title */
          text-align: center;
          /* Center-align the text */
          margin: 0;
          /* Remove any default margin */
        }
    
        /* Navigation Bar Adjustments */
        .navbar-brand h1 {
          font-size: 36px;
          /* Adjust title font size */
          text-align: left;
          /* Align to the left */
        }
      </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <!-- Left side: Logo -->
            <a class="navbar-brand" href="/">
                <img src="https://images-platform.99static.com/8FQAtBlqlQHj74USbZmrAFLZKW0=/500x500/top/smart/99designs-contests-attachments/16/16498/attachment_16498083"
                    alt="Logo" class="logo">
                <!-- Middle: Web Name -->
                <b><i><u>Gradify</u></i></b>
            </a>

            <!-- Collapsible Menu (About, Other Pages) -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/cousres">Courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
            </div>

            <!-- Right side: Search Bar and Menu (Hamburger Icon) -->
            <div class="d-flex align-items-center">
                <!-- Search Bar -->
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <!-- Hamburger Menu (3 Lines) -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

        </div>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Dashboard</h4>
                    </div>
                    <div class="card-body">
                        {% if user %}
                        <h5 class="card-title">Logged in as: {{ user[1] }}</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><strong>Name:</strong> {{ user[1] }}</li>
                            <li class="list-group-item"><strong>Age:</strong> {{ user[2] }}</li>
                            <li class="list-group-item"><strong>Gender:</strong> {{ user[3] }}</li>
                            <li class="list-group-item"><strong>Profession:</strong> {{ user[4] }}</li>
                        </ul>
                        {% else %}
                        <p class="text-danger">User data not found.</p>
                        {% endif %}
                    </div>
                    <div class="card-footer text-center">
                        <a href="/" class="btn btn-primary">Home</a>
                        <form method="POST" action="/logout" class="d-inline">
                            <button type="submit" class="btn btn-danger">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link to Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>

</html>
